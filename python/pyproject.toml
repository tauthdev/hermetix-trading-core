[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermetix"
version = "0.2.0"
description = "증권사 모의투자 통합 트레이딩 프레임워크 - Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["trading", "paper-trading", "stock", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# 런타임 의존성 없음 - 표준 라이브러리만 사용한다
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hermetix*"]
